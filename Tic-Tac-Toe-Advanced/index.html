<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tic-Tac-Toe</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="wrap">
    <h1 class="title">Tic-Tac-Toe</h1>

    <form id="setup-form" class="setup">
      <input type="text" id="player-x-name" placeholder="Player 1 (X)" maxlength="12" autocomplete="off" />
      <input type="text" id="player-o-name" placeholder="Player 2 (O)" maxlength="12" autocomplete="off" />

      <select id="mode-select" aria-label="Game mode">
        <option value="pvp">Player vs Player</option>
        <option value="ai">Player vs Computer</option>
      </select>

      <select id="difficulty-select" aria-label="Computer difficulty" hidden>
        <option value="easy">Easy</option>
        <option value="medium">Medium</option>
        <option value="hard">Unbeatable</option>
      </select>

      <button type="submit" id="start-btn" class="btn">Start Match</button>
    </form>

    <div id="scoreboard" class="scoreboard" hidden>
      <span class="score"><span id="score-x">0</span><span class="score-label">X</span></span>
      <span class="score"><span id="score-ties">0</span><span class="score-label">Ties</span></span>
      <span class="score"><span id="score-o">0</span><span class="score-label">O</span></span>
    </div>

    <p id="status" class="status" aria-live="polite"></p>

    <div id="board" class="board" role="grid" aria-label="Tic-tac-toe board" hidden></div>

    <div class="round-controls">
      <button type="button" id="next-round-btn" class="btn" hidden>Next Round</button>
      <button type="button" id="new-match-btn" class="btn" hidden>New Match</button>
    </div>
  </main>

  <script src="index.js"></script>
</body>
</html>
