<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tic-Tac-Toe</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="wrap">
    <h1 class="title">Tic-Tac-Toe</h1>

    <form id="setup-form" class="setup">
      <input type="text" id="player-x-name" placeholder="Player 1 (X)" maxlength="12" autocomplete="off" />
      <input type="text" id="player-o-name" placeholder="Player 2 (O)" maxlength="12" autocomplete="off" />
      <button type="submit" id="start-btn">Start</button>
    </form>

    <p id="status" class="status" aria-live="polite"></p>

    <div id="board" class="board" role="grid" aria-label="Tic-tac-toe board"></div>
  </main>

  <script src="index.js"></script>
</body>
</html>
