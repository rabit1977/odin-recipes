<!doctype html>

<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#121212" />
    <title>Advanced Calculator</title>
    <script src="index.js" defer></script>
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <main class="calculator">
      <!-- Top controls -->
      <div class="top-bar">
        <button class="mode-toggle" id="modeToggle" type="button">
          Scientific
        </button>

        <div class="top-actions">
          <button
            class="icon-button"
            id="copyButton"
            type="button"
            aria-label="Copy result"
            title="Copy result"
          >
            📋
          </button>

          <button
            class="icon-button"
            id="themeToggle"
            type="button"
            aria-label="Toggle theme"
            title="Toggle theme"
          >
            🌙
          </button>
        </div>
      </div>

      <!-- Expression -->
      <div class="expression" id="expression" aria-live="polite"></div>

      <!-- Display -->
      <div class="display-wrapper">
        <span class="memory-indicator" id="memoryIndicator"> M </span>

        <div class="display" id="display" aria-live="polite">0</div>
      </div>

      <!-- Scientific -->
      <div class="scientific-buttons hidden" id="scientificButtons">
        <button class="btn scientific" data-action="sqrt">√</button>

        <button class="btn scientific" data-action="square">x²</button>

        <button class="btn scientific" data-action="power">xʸ</button>

        <button class="btn scientific" data-action="inverse">1/x</button>

        <button class="btn scientific" data-function="sin">sin</button>

        <button class="btn scientific" data-function="cos">cos</button>

        <button class="btn scientific" data-function="tan">tan</button>

        <button class="btn scientific" data-function="log">log</button>

        <button class="btn scientific" data-function="ln">ln</button>

        <button class="btn scientific" data-constant="pi">π</button>

        <button class="btn scientific" data-constant="e">e</button>

        <button class="btn scientific" data-action="openParen">(</button>

        <button class="btn scientific" data-action="closeParen">)</button>
      </div>

      <!-- Main buttons -->
      <div class="buttons">
        <!-- Memory -->
        <button class="btn memory" id="memClear">MC</button>
        <button class="btn memory" id="memRecall">MR</button>
        <button class="btn memory" id="memAdd">M+</button>
        <button class="btn memory" id="memSubtract">M−</button>

        <!-- Utilities -->
        <button class="btn utility" id="clear">AC</button>
        <button class="btn utility" id="backspace">⌫</button>
        <button class="btn utility" id="percent">%</button>
        <button class="btn operator" data-operator="/">÷</button>

        <!-- 7 8 9 -->
        <button class="btn digit" data-digit="7">7</button>
        <button class="btn digit" data-digit="8">8</button>
        <button class="btn digit" data-digit="9">9</button>
        <button class="btn operator" data-operator="*">×</button>

        <!-- 4 5 6 -->
        <button class="btn digit" data-digit="4">4</button>
        <button class="btn digit" data-digit="5">5</button>
        <button class="btn digit" data-digit="6">6</button>
        <button class="btn operator" data-operator="-">−</button>

        <!-- 1 2 3 -->
        <button class="btn digit" data-digit="1">1</button>
        <button class="btn digit" data-digit="2">2</button>
        <button class="btn digit" data-digit="3">3</button>
        <button class="btn operator" data-operator="+">+</button>

        <!-- Bottom -->
        <button class="btn utility" id="sign">±</button>
        <button class="btn digit" data-digit="0">0</button>
        <button class="btn digit" data-digit=".">.</button>
        <button class="btn equals" id="equals">=</button>
      </div>

      <!-- History -->
      <section class="history-panel">
        <div class="history-header">
          <span>History</span>

          <button class="history-clear" id="historyClear" type="button">
            Clear
          </button>
        </div>

        <ul class="history-list" id="historyList"></ul>
      </section>

      <!-- Keyboard help -->
      <div class="shortcuts">
        <span>Keyboard:</span>
        <kbd>0-9</kbd>
        <kbd>.</kbd>
        <kbd>+</kbd>
        <kbd>-</kbd>
        <kbd>*</kbd>
        <kbd>/</kbd>
        <kbd>%</kbd>
        <kbd>( )</kbd>
        <kbd>Enter</kbd>
        <kbd>Esc</kbd>
        <kbd>Ctrl+Z</kbd>
        <kbd>Ctrl+Y</kbd>
      </div>
    </main>
  </body>
</html>
