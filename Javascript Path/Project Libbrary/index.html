<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Library</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="wrap">
    <header class="top">
      <h1>Library</h1>
      <button id="new-book-btn" class="ghost-btn" type="button">+ New Book</button>
    </header>

    <div id="shelf" class="shelf"></div>

    <p id="empty-state" class="empty-state" hidden>
      Nothing on the shelf yet. Add your first book.
    </p>
  </div>

  <dialog id="book-dialog">
    <form id="book-form" novalidate>
      <input
        type="text"
        id="title"
        name="title"
        placeholder="Title"
        autocomplete="off"
        required
      />
      <input
        type="text"
        id="author"
        name="author"
        placeholder="Author"
        autocomplete="off"
        required
      />
      <input
        type="number"
        id="pages"
        name="pages"
        placeholder="Pages"
        min="1"
        autocomplete="off"
        required
      />
      <label class="check-row">
        <input type="checkbox" id="read" name="read" />
        <span>Already read</span>
      </label>
      <div class="dialog-actions">
        <button type="button" id="cancel-btn" class="ghost-btn">Cancel</button>
        <button type="submit" class="solid-btn">Add to shelf</button>
      </div>
    </form>
  </dialog>

  <script src="index.js"></script>
</body>
</html>
